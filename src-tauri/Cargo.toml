[package]
name = "captnz-board"
version = "1.0.0"
description = "Captnz Board — Zero-latency 4K Interactive Whiteboard, PDF Annotator & Presentation Viewer"
authors = ["Captnz"]
edition = "2021"

[lib]
name = "captnz_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
